<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wall A</title>
  <style>
    body {
      margin: 0;
      background: #111;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #wall {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      aspect-ratio: 3 / 2;          /* matches the 1620 x 1080 crop */
      width: min(100vw, 150vh);     /* fits the screen without cropping */
    }
    .square img {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="wall"></div>

  <script type="module">
    import { db, ref, onValue } from "../shared/firebase.js";

    const TOTAL = 54;
    const FADE_MS = 30 * 1000;
    const MIN_OPACITY = 0.2;

    // build the tiles once
    const wall = document.getElementById("wall");
    const tiles = [];
    for (let i = 1; i <= TOTAL; i++) {
      const div = document.createElement("div");
      div.className = "square";
      div.innerHTML = `<img src="../images/wall-A-pieces/piece-${i}.png" alt="">`;
      wall.appendChild(div);
      tiles[i] = div;
    }

    let squares = {};
    onValue(ref(db, "walls/A/squares"), function (snapshot) {
      squares = snapshot.val() || {};
    });

    function opacityFor(i) {
      const square = squares[i];
      if (!square || !square.restoredAt) return MIN_OPACITY;
      const age = Date.now() - square.restoredAt;
      return Math.max(MIN_OPACITY, 1 - age / FADE_MS);
    }

    function draw() {
      for (let i = 1; i <= TOTAL; i++) {
        tiles[i].style.opacity = opacityFor(i);
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
